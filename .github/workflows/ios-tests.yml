# Two independent macOS jobs: compile and run the XCTest target, and build the shipping
# Expo app. They are deliberately separate jobs -- they answer different questions ("do
# the unit tests pass" and "does the app that ships compile") and the second is much
# slower -- and neither depends on the other, so one can never hide the other's failure.
# Nothing here signs, deploys, submits or spends EAS build minutes.
#
# JOB 1: verify-native-tests
#
# Compile and run the XCTest target on a macOS runner.
#
# This exists because EAS iOS builds are a rationed monthly resource on the free plan:
# the minutes were exhausted and do not reset until 1 October 2026, so the `verify-tests`
# EAS profile could not be run at all. A GitHub-hosted macOS runner performs the same
# verification and spends none of those minutes.
#
# It deliberately does not repeat the command sequence. scripts/verify-native-tests.mjs
# already installs XcodeGen when it is missing, runs `xcodegen generate`, runs
# `xcodebuild build-for-testing`, discovers an available iPhone simulator, and runs
# `test-without-building`, printing the VIDEOSHRINK TEST TARGET COMPILE and
# VIDEOSHRINK TEST RUN banners and exiting non-zero when a test fails. This job only
# sets the opt-in variable and runs that script, exactly as the EAS `verify-tests`
# profile does through `eas-build-post-install`, so there is one implementation to keep
# correct and a CI failure means what an EAS failure means.
#
# No Apple signing is involved: the two xcodebuild invocations the script runs both pass
# CODE_SIGNING_ALLOWED=NO and target the iOS Simulator, so there is no distribution
# certificate, no provisioning profile and no registered device. Nothing here publishes
# or releases anything; the job compiles both targets and runs the tests, and that is all.
#
# macos-15 is chosen because its Xcode 16.x image carries the iOS 18 SDK that project.yml
# requires (deploymentTarget iOS 18.0), and the image's simulator set includes iOS 18
# iPhone runtimes for the script's destination discovery to find. The script adds both
# Homebrew prefixes (/opt/homebrew and /usr/local) to PATH, so the job does not depend on
# which architecture the image ships. Bump the image tag when GitHub retires this one.

name: iOS tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# The job only reads the repository and runs tests.
permissions:
  contents: read

jobs:
  verify-native-tests:
    name: Compile and run VideoShrinkTests
    runs-on: macos-15
    # Generous next to the observed timings (a few minutes of compile, then about seven
    # seconds of test execution), but bounded so a hung simulator cannot hold a runner
    # for GitHub's six-hour default.
    timeout-minutes: 45
    env:
      # Equivalent to: VIDEOSHRINK_VERIFY_TESTS=1 node scripts/verify-native-tests.mjs
      VIDEOSHRINK_VERIFY_TESTS: "1"
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Node 24: the repo's packageManager pin npm@11.19.0 needs Node 20.17+ or
          # 22.9+, and 24.x is the line this project is developed on locally
          # (Node 24.21.0 with npm 11.19.0). A current LTS suits Expo SDK 57.
          node-version: "24"

      - name: Install dependencies
        # npm ci also runs the repo's postinstall script, which regenerates the mirrored
        # Swift under modules/videoshrink-native/ios/VideoShrinkCore/ before the compile
        # phase reads it. No dependency cache is configured on purpose: a stale cache
        # would make a failing run harder to trust.
        run: npm ci

      - name: Compile and run the XCTest cases
        run: node scripts/verify-native-tests.mjs

  # JOB 2: build-expo-app
  #
  # Nothing else in this repository compiles the app that actually ships. `ios-tests` job
  # 1 above reads VideoShrink/ directly, through project.yml, and never runs `expo
  # prebuild` or `pod install`, so modules/videoshrink-native/ios/VideoShrinkNativeView.swift
  # and VideoShrinkNativeModule.swift -- the two files that make this an Expo app -- are
  # compiled by no gate. EAS does compile them, but EAS iOS build minutes are a rationed
  # monthly resource on the free plan, so before this job a mistake in those files could
  # sit unnoticed for weeks. This job makes it visible on the next push.
  #
  # It compiles the same Swift an EAS build compiles: the pod's source_files glob in
  # modules/videoshrink-native/ios/VideoShrinkNative.podspec is "**/*.{h,m,mm,swift,hpp,cpp}",
  # which covers the module's own Swift and VideoShrinkCore/, the mirror of
  # VideoShrink/{Models,Services,Presentation} that scripts/sync-native-sources.mjs writes.
  #
  # It does not run the tests (job 1 does that, on its own faster path), and it does not
  # sign, deploy or submit anything: the destination is a generic iOS Simulator and
  # CODE_SIGNING_ALLOWED=NO, so it needs no Apple account, no certificate and no
  # registered device, and it spends no EAS minutes. It needs nothing that this runner
  # image does not already have: Node comes from setup-node, and Xcode, the iOS
  # simulator SDK and CocoaPods ship with macos-15.
  #
  # The whole sequence lives in scripts/verify-expo-build.mjs so that CI and a human on a
  # Mac run the same thing, and so the scheme and workspace are discovered from what
  # `pod install` and `xcodebuild -list` report rather than hardcoded.
  build-expo-app:
    name: Build the Expo iOS app for the simulator
    runs-on: macos-15
    # A full `expo prebuild`, a `pod install` and an unoptimised simulator build of the
    # entire React Native app is several times the cost of job 1's compile: minutes for the
    # prebuild, several more for the pods, and the app build dominates. 90 minutes is
    # headroom for a cold runner rather than an expectation, and it keeps a hung build
    # well inside GitHub's six-hour default.
    timeout-minutes: 90
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # The same line as job 1, and for the same reason: the repo's packageManager
          # pin npm@11.19.0 needs Node 20.17+ or 22.9+, and 24.x is the line this project
          # is developed on locally.
          node-version: "24"

      - name: Install dependencies
        # npm ci runs the repo's postinstall, which is scripts/sync-native-sources.mjs,
        # the same script the EAS builder runs on post-install. That is what puts the
        # mirrored Swift under modules/videoshrink-native/ios/VideoShrinkCore/ in place
        # before the build reads it. No dependency cache is configured on purpose: a
        # stale cache would make both a pass and a failure harder to trust.
        run: npm ci

      - name: Build the shipping app
        # One script, five steps: assert the native-source mirror is in sync (the check
        # EAS makes from eas-build-post-install), assert ios/ does not already exist,
        # `npx expo prebuild --platform ios --no-install`, `pod install`, discover the
        # generated workspace and scheme, then build the app for the simulator with
        # signing off. Any failure exits non-zero under a FAILED banner and prints the
        # tool's own error immediately above it.
        run: node scripts/verify-expo-build.mjs
