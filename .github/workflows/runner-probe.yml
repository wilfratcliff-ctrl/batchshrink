# A temporary diagnostic, not part of the verification story. Delete it once the question it
# asks has an answer.
#
# On 2026-09-23 every job in the real workflow stopped getting a runner: three jobs, two runs
# (the original and a re-run), each reporting failure about nine seconds after it was created,
# with `runner_name` empty and no steps at all. GitHub's status API said "All Systems
# Operational" at the same moment, so the next question is whether the account can start *any*
# runner or only the macOS ones - which on a private repository are billed at ten times the
# Linux rate. An Ubuntu job is the cheapest way to ask.
name: Runner probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Can this account start a Linux runner?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Say so
        run: |
          echo "An Ubuntu runner started, so the account can still start runners."
          uname -a
